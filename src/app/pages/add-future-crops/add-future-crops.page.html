<ion-content [fullscreen]="true">
    <div style="margin: 0 0 0 0;">
        <ion-grid style="padding: 0 0 !important;">
            <ion-row style="padding: 0 0 0 0;" class="ion-justify-content-between">
                <ion-col size="auto" class="no-padding">
                    <ion-button fill="clear" style="color: rgb(128, 126, 126);" (click)="back()">Back</ion-button>
                </ion-col>
                <ion-col size="auto" class="no-padding">
                    <ion-button fill="clear" style="color: black;" (click)="save()">Submit</ion-button>
                </ion-col>
            </ion-row>
        </ion-grid>
    </div>
    <div style="margin: 0 0 0 0;">
        <ion-grid>
            <ion-row>
                <ion-col class="no-padding title" style="padding: 0 0 0 5px !important;">
                    Create Future Crops Post
                </ion-col>
            </ion-row>
        </ion-grid>

        <ion-grid>
            <ion-row class="text-white" style="margin: 10px 0 0 0;">
                <ion-col size="auto" class="no-padding" style="padding: 0 0 0 5px !important;">
                    <ion-avatar style="width: 50px !important; height: 50px !important;">
                        <img alt="Silhouette of a person's head" [src]="user.profile_photo"
                            onerror="this.src='https://ionicframework.com/docs/img/demos/avatar.svg'" />
                    </ion-avatar>
                </ion-col>
                <ion-col class="no-padding" style="padding: 0 0 0 5px !important; display: flex !important;">
                    <ion-grid style="margin: 0px !important; padding: 0px !important;">
                        <ion-row>
                            <ion-col class="no-padding">
                                {{user.first_name}} {{user.last_name}}
                            </ion-col>
                        </ion-row>
                        <ion-row class="no-padding">
                            <ion-col style="padding: 0 15px 0 0 !important;">
                                <ion-grid style="margin: 0px !important; padding: 0 15px 0 0 !important;">
                                    <ion-row>
                                        <ion-col size="auto" class="no-padding">
                                            <ion-icon name="location-outline"></ion-icon>
                                        </ion-col>
                                        <ion-col class="no-padding" style="text-align: left; font-size: 14px;">
                                            {{user.address}}
                                        </ion-col>
                                    </ion-row>
                                </ion-grid>
                            </ion-col>
                        </ion-row>
                    </ion-grid>
                </ion-col>
            </ion-row>
        </ion-grid>

        <ion-grid style="padding: 0 0 !important; margin: 20px 0 0 0 !important;">
            <ion-row>
                <ion-col>
                    <ion-title class="form-label">What's your future crop?</ion-title>
                </ion-col>
            </ion-row>
            <ion-row>
                <ion-col style="padding: 0 20px;">
                    <ion-input fill="outline" labelPlacement="fixed" placeholder="" class="custom"></ion-input>
                </ion-col>
            </ion-row>

            <ion-row>
                <ion-col>
                    <ion-row>
                        <ion-col>
                            <ion-title class="form-label">Quantity</ion-title>
                        </ion-col>
                        <ion-col>
                            <ion-title class="form-label">Estimated Date</ion-title>
                        </ion-col>
                        <ion-col>
                            <ion-title class="form-label">Estimated Price</ion-title>
                        </ion-col>
                    </ion-row>
                    <ion-row>
                        <ion-col style="padding: 0 15px;">
                            <ion-input fill="outline" labelPlacement="fixed" placeholder="" class="custom"></ion-input>
                        </ion-col>
                        <ion-col style="padding: 0 15px;">
                            <ion-input fill="outline" labelPlacement="fixed" placeholder="" class="custom"></ion-input>
                        </ion-col>
                        <ion-col style="padding: 0 15px;">
                            <ion-input fill="outline" labelPlacement="fixed" placeholder="" class="custom"></ion-input>
                        </ion-col>
                    </ion-row>
                </ion-col>
            </ion-row>

            <ion-row>
                <ion-col>
                    <ion-title class="form-label">Attach Display Photo</ion-title>
                </ion-col>
            </ion-row>
            <ion-row>
                <ion-col style="padding: 0 20px;">
                    <ion-button expand="block" color="success" size="large">+ Add
                        Photo</ion-button>
                </ion-col>
            </ion-row>
        </ion-grid>
    </div>

</ion-content>
